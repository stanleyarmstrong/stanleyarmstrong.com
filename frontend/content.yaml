intro:
 - "Fractional Full-Stack Development & Automation Partner"
 - "I help operationally-heavy businesses and lean startup teams ship full-stack products and in order to improve internal and external process to save them thousands of hours of work without the overhead of a full-time hire."
 - "I work with a small number of partners at a time, embedded in your team like an in-house engineer, so the systems I build get adopted, maintained, and trusted long after launch."

proof:
  - "2x Automotive Dealer warranty claim capacity scaled through automation, no additional headcount"
  - "Fortune 500 market data ETL pipelines built and maintained in production"
  - "FDA and HIPAA-compliant medical device software shipped"
  - "5+ years professional full-stack & automation experience"

services:
  - title: "Build & Rescue Your Sprint"
    idealFor: "Teams that need a working product shipped, or a stalled/broken project rescued, FAST."
    cadence: "Fixed Scope"
    tools: ["React", "Next.js", "TypeScript", "JavaScript", "Python", "Django", "FastAPI", "Pandas", "Playwright", "Airflow", "Spark", "SQL"]
    reviews:
      - content: "\"I had the pleasure of working with him on a Python programming project, and I couldn't be more impressed with his work. Not only did he deliver exceptional results with his programming skills, but his ability to communicate and work effectively with my client was outstanding. He approached the project with professionalism, attention to detail, and a clear understanding of requirements. His expertise in Python programming is top-notch, and he consistently went above and beyond to ensure everything ran smoothly. I highly recommend him for anyone looking for a talented and reliable developer!\""
        author: "Valerie Noblitt, Diogras Consulting"
    description:
      - "Have an app idea, a launch deadline, or an existing app with a bug you've spent too long chasing? This is the fastest way to get unstuck."
      - "I've re-architected half-finished apps into production-ready products and shipped new ones from scratch, combining technical execution with clear communication and unreasonable hospitality — so you get a solution that works for both you and your business. Consider this a trial run: I'll solve your immediate problem now, and if there's a mutual fit, we continue building projects together with me as your Ongoing Engineering Partner."

  - title: "Ongoing Engineering Partner"
    idealFor: "Founders and operations-heavy teams who need senior engineering support and automation, without a full-time hire."
    cadence: "Ongoing Retainer"
    focusAreas: ["Full Stack Web Development", "Automation and ETL"]
    reviews:
      - content: "\"He took a project that was halfway done and re-architected it to be an impressive web app. Skilled up and down the tech stack, he designed and implemented a backend, directed the frontend efforts and came up with clever solutions whenever problems crept up (recreating web scrapers, troubleshooting database issues and identifying opportunities to automate processes at every turn). Great communicator, offered contributions on the marketing and strategic side as well. I especially appreciate his off-hours support as needed (on more than a few occasions). Really hope I get to work with him again.\""
        author: "John Shields, Whenzy"
    description:
      - "You don't need another contractor who disappears after the sprint. You need someone who understands the whole system — product, architecture, and the people who use it — and sticks around to own it."
      - "I work alongside your team as an embedded engineering partner: reviewing architecture, contributing to standards, shipping code, and improving the internal systems and processes that take repetitive work off your team's plate — the same kind of work that helped scale a dealer network's operations 2x without adding to the headcount. This is the same kind of work I've done leading engineering initiatives end to end, brought to your team fractionally, as you need it, and for less than a full-time hire."
      - "This retainer is designed to follow a successful Fixed Scope Sprint — by then, I've already proven I know your codebase and how your team works, so there's no ramp-up period necessary."

experience:
  - company: "Automotive Warranty Network"
    role: "Automation Team Lead and Software Engineer"
    description:
    - "Scaled the company's dealer platform, C.A.R.S., to serve 2x as many dealers, then built the automation systems — Kubernetes infrastructure, Django REST APIs, and Playwright browser automations — that took hundreds of manual hours a month off the team's plate, without adding headcount."
    - "Joined as a Software Engineering consultant and was promoted to Automation Team Lead, leading a team of 3 engineers building automated workflows and shipping features across web and mobile (App Store and Google Play)."

  - company: "Whenzy"
    role: "Ongoing Engineering Partner"
    description:
    - "Took over a stalled build, re-architected it, and shipped it to production — deploying Whenzy to its live domain."
    - "Fixed the site's web scrapers to run reliably on an automated schedule, then designed and implemented new features as the product grew."

  - company: "Advana"
    role: "Software Engineer - Data Engineering"
    description:
    - "Built and maintained ETL pipelines and an S3-based, parquet-backed data warehousing strategy supporting both internal and client-facing reporting for Fortune 500 clients."
    - "Transitioned from full-stack development into data engineering, using Apache Airflow and Spark to optimize where and how data was processed at scale."

  - company: "Promaxo"
    role: "Software Engineer"
    description:
    - "Shipped FDA/HIPAA-compliant medical device software as part of a 4-engineer team, improving the accuracy and treatment of prostate cancer for the doctors using the product."
    - "Worked across embedded systems, web applications, and manufacturing process improvements — learning regulatory compliance requirements along the way — in a startup environment that required wearing multiple hats and learning quickly."

